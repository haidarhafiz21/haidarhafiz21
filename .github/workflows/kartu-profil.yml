name: Perbarui kartu profil

on:
  schedule:
    - cron: "0 * * * *" # setiap pergantian jam (termasuk 00.00 WIB)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: kartu-profil
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Buat kartu statistik, streak, dan grafik
        run: node scripts/generate.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT: dist

      # Hasilnya disimpan di cabang "output" (bukan main), jadi riwayat main tetap bersih
      - name: Kirim ke cabang output
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Perbarui kartu profil"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
