<svg xmlns="http://www.w3.org/2000/svg" width="990" height="227" viewBox="0 0 990 227" role="img" aria-label="Perjalanan 2023 sampai sekarang">
<title>Perjalanan 2023 sampai sekarang</title>
<style>
  text { font-family: 'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif; }
  .mono { font-family: Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace; letter-spacing: 2px; }
  .serif { font-family: Georgia, 'Times New Roman', serif; font-style: italic; }
  /* Isi selalu tampil walau animasi tidak jalan; animasi hanya efek masuk/hidup */
  .rise { animation: rise .9s cubic-bezier(.16,1,.3,1) backwards; }
  .fade { animation: fade 1s ease-out backwards; }
  .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: barUp 1.1s cubic-bezier(.16,1,.3,1) backwards; }
  .seg { transform-box: fill-box; transform-origin: 0 50%; animation: segIn .9s cubic-bezier(.16,1,.3,1) backwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes barUp { from { transform: scaleY(0); } }
  @keyframes segIn { from { transform: scaleX(0); opacity: 0; } }
  @keyframes draw { from { stroke-dashoffset: 1; } }
  
  .pop { transform-box: fill-box; transform-origin: center; animation: pop .7s cubic-bezier(.34,1.56,.64,1) backwards; }
  .grow { transform-box: fill-box; transform-origin: 50% 100%; animation: growY .8s cubic-bezier(.16,1,.3,1) backwards; }
  .grow-x { transform-box: fill-box; transform-origin: 0 50%; animation: growX .9s cubic-bezier(.16,1,.3,1) backwards; }
  .draw { animation: draw 1.8s .6s cubic-bezier(.65,0,.35,1) backwards; }
  .cursor { animation: cursor 6s 1s cubic-bezier(.65,0,.35,1) infinite backwards; }
  .ripple { transform-box: fill-box; transform-origin: center; opacity: 0; animation: ripple 6s 1s ease-out infinite; }
  .scan { animation: scan 2.4s ease-in-out infinite alternate; }
  .flow { animation: flow 1.2s linear infinite; }
  .ping { transform-box: fill-box; transform-origin: center; animation: ping 2.2s ease-out infinite; }
  @keyframes pop { from { opacity: 0; transform: scale(.6); } }
  @keyframes growY { from { transform: scaleY(0); } }
  @keyframes growX { from { transform: scaleX(0); } }
  @keyframes cursor {
    0%, 100% { transform: translate(218px, 30px); }
    38%, 52% { transform: translate(0, 0); }
  }
  @keyframes ripple { 0%, 40% { opacity: 0; transform: scale(.6); } 44% { opacity: .9; } 60%, 100% { opacity: 0; transform: scale(2.4); } }
  @keyframes scan { from { transform: translateY(0); } to { transform: translateY(46px); } }
  @keyframes flow { to { stroke-dashoffset: -18; } }
  @keyframes ping { from { opacity: .9; transform: scale(1); } to { opacity: 0; transform: scale(3.4); } }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="0.5" y="0.5" width="989" height="226" rx="14" fill="#0f1115" stroke="#262a33"/>

<text x="28" y="38" font-size="11" fill="#8f8a80" class="mono fade">PERJALANAN</text>
<text x="962" y="38" font-size="11" fill="#8f8a80" class="mono fade" text-anchor="end">2023 → SEKARANG</text>
<line x1="34" y1="96" x2="962" y2="96" stroke="#262a33" stroke-width="1.5"/>
<line x1="34" y1="96" x2="962" y2="96" stroke="#f2a03d" stroke-width="1.5" stroke-opacity=".7" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0" style="animation: draw 1.8s .2s cubic-bezier(.65,0,.35,1) backwards"/>

<g class="rise" style="animation-delay:0.5s"><text x="28" y="76" font-size="30" font-weight="700" fill="#f2a03d" class="serif">2023</text></g>
<circle cx="34" cy="96" r="6" fill="#0f1115" stroke="#f2a03d" stroke-width="2.5" class="pop" style="animation-delay:0.5s"/>
<g class="rise" style="animation-delay:0.62s">
  <text x="28" y="128" font-size="14.5" font-weight="700" fill="#ece6da">Proyek web pertama</text>
  <text x="28" y="148" font-size="12.5" fill="#8f8a80">Website profil UTS dan Bisahosting</text><text x="28" y="165" font-size="12.5" fill="#8f8a80">(proyek kelompok) dengan HTML,</text><text x="28" y="182" font-size="12.5" fill="#8f8a80">Pug, dan SCSS.</text>
</g>
<g class="rise" style="animation-delay:0.8200000000000001s"><text x="272" y="76" font-size="30" font-weight="700" fill="#f2a03d" class="serif">2024</text></g>
<circle cx="278" cy="96" r="6" fill="#0f1115" stroke="#f2a03d" stroke-width="2.5" class="pop" style="animation-delay:0.8200000000000001s"/>
<g class="rise" style="animation-delay:0.9400000000000001s">
  <text x="272" y="128" font-size="14.5" font-weight="700" fill="#ece6da">Mulai ke backend</text>
  <text x="272" y="148" font-size="12.5" fill="#8f8a80">Aplikasi CRUD data mahasiswa</text><text x="272" y="165" font-size="12.5" fill="#8f8a80">dengan Express.js, EJS, dan MySQL.</text>
</g>
<g class="rise" style="animation-delay:1.1400000000000001s"><text x="516" y="76" font-size="30" font-weight="700" fill="#f2a03d" class="serif">2025</text></g>
<circle cx="522" cy="96" r="6" fill="#0f1115" stroke="#f2a03d" stroke-width="2.5" class="pop" style="animation-delay:1.1400000000000001s"/>
<g class="rise" style="animation-delay:1.2600000000000002s">
  <text x="516" y="128" font-size="14.5" font-weight="700" fill="#ece6da">Magang &amp; proyek tim</text>
  <text x="516" y="148" font-size="12.5" fill="#8f8a80">Magang di Jatim Times Network,</text><text x="516" y="165" font-size="12.5" fill="#8f8a80">platform tryout LuLuSin bersama tim,</text><text x="516" y="182" font-size="12.5" fill="#8f8a80">dan aplikasi pemesanan ikan dengan</text><text x="516" y="199" font-size="12.5" fill="#8f8a80">Midtrans.</text>
</g>
<g class="rise" style="animation-delay:1.46s"><text x="760" y="76" font-size="30" font-weight="700" fill="#ff6b5a" class="serif">2026</text></g>
<circle cx="766" cy="96" r="6" fill="#0f1115" stroke="#ff6b5a" stroke-width="2.5" class="pop" style="animation-delay:1.46s"/>
<g class="rise" style="animation-delay:1.58s">
  <text x="760" y="128" font-size="14.5" font-weight="700" fill="#ece6da">Lulus &amp; rilis produk</text>
  <text x="760" y="148" font-size="12.5" fill="#8f8a80">D3 Teknik Informatika PENS PSDKU</text><text x="760" y="165" font-size="12.5" fill="#8f8a80">Sumenep, IPK 3.46. Juara 2 Final</text><text x="760" y="182" font-size="12.5" fill="#8f8a80">Project Competition. Merilis Venus</text><text x="760" y="199" font-size="12.5" fill="#8f8a80">Digital.</text>
</g>
</svg>