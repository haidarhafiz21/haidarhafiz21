<svg xmlns="http://www.w3.org/2000/svg" width="990" height="227" viewBox="0 0 990 227" role="img" aria-label="Perjalanan 2023 sampai sekarang">
<title>Perjalanan 2023 sampai sekarang</title>
<style>
  text { font-family: 'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif; }
  .mono { font-family: Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace; letter-spacing: 2px; }
  .serif { font-family: Georgia, 'Times New Roman', serif; font-style: italic; }
  /* Isi selalu tampil walau animasi tidak jalan; animasi hanya efek masuk/hidup */
  .rise { animation: rise .9s cubic-bezier(.16,1,.3,1) backwards; }
  .fade { animation: fade 1s ease-out backwards; }
  .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: barUp 1.1s cubic-bezier(.16,1,.3,1) backwards; }
  .seg { transform-box: fill-box; transform-origin: 0 50%; animation: segIn .9s cubic-bezier(.16,1,.3,1) backwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes barUp { from { transform: scaleY(0); } }
  @keyframes segIn { from { transform: scaleX(0); opacity: 0; } }
  @keyframes draw { from { stroke-dashoffset: 1; } }
  
  .pop { transform-box: fill-box; transform-origin: center; animation: pop .6s cubic-bezier(.16,1,.3,1) backwards; }
  @keyframes pop { from { opacity: 0; transform: scale(.6); } }
  /* gerak pelan tanpa efek cahaya */
  .live { animation: soft 2.8s ease-in-out infinite; }
  .nudge { animation: nudge 3.2s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes soft { 50% { opacity: .35; } }
  @keyframes nudge { 0%, 60%, 100% { transform: translate(0, 0); } 75% { transform: translate(2.5px, -2.5px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="0.5" y="0.5" width="989" height="226" rx="14" fill="#0d1117" stroke="#2a313c"/>

<text x="28" y="38" font-size="11" fill="#8b949e" class="mono fade">PERJALANAN</text>
<text x="962" y="38" font-size="11" fill="#8b949e" class="mono fade" text-anchor="end">2023 – SEKARANG</text>
<line x1="34" y1="96" x2="962" y2="96" stroke="#2a313c" stroke-width="1.5"/>
<line x1="34" y1="96" x2="962" y2="96" stroke="#6ca0dc" stroke-width="1.5" stroke-opacity=".55" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0" style="animation: draw 1.6s .2s cubic-bezier(.65,0,.35,1) backwards"/>

<g class="rise" style="animation-delay:0.4s"><text x="28" y="76" font-size="28" font-weight="700" fill="#e6edf3" class="serif">2023</text></g>
<circle cx="34" cy="96" r="5" fill="#0d1117" stroke="#6ca0dc" stroke-width="2" class="pop" style="animation-delay:0.4s"/>
<g class="rise" style="animation-delay:0.5s">
  <text x="28" y="128" font-size="14" font-weight="700" fill="#e6edf3">Proyek web pertama</text>
  <text x="28" y="148" font-size="12.5" fill="#8b949e">Website profil UTS dan Bisahosting</text><text x="28" y="165" font-size="12.5" fill="#8b949e">(proyek kelompok) dengan HTML,</text><text x="28" y="182" font-size="12.5" fill="#8b949e">Pug, dan SCSS.</text>
</g>
<g class="rise" style="animation-delay:0.65s"><text x="272" y="76" font-size="28" font-weight="700" fill="#e6edf3" class="serif">2024</text></g>
<circle cx="278" cy="96" r="5" fill="#0d1117" stroke="#6ca0dc" stroke-width="2" class="pop" style="animation-delay:0.65s"/>
<g class="rise" style="animation-delay:0.75s">
  <text x="272" y="128" font-size="14" font-weight="700" fill="#e6edf3">Mulai ke backend</text>
  <text x="272" y="148" font-size="12.5" fill="#8b949e">Aplikasi CRUD data mahasiswa</text><text x="272" y="165" font-size="12.5" fill="#8b949e">dengan Express.js, EJS, dan MySQL.</text>
</g>
<g class="rise" style="animation-delay:0.9s"><text x="516" y="76" font-size="28" font-weight="700" fill="#e6edf3" class="serif">2025</text></g>
<circle cx="522" cy="96" r="5" fill="#0d1117" stroke="#6ca0dc" stroke-width="2" class="pop" style="animation-delay:0.9s"/>
<g class="rise" style="animation-delay:1s">
  <text x="516" y="128" font-size="14" font-weight="700" fill="#e6edf3">Magang &amp; proyek tim</text>
  <text x="516" y="148" font-size="12.5" fill="#8b949e">Magang di Jatim Times Network,</text><text x="516" y="165" font-size="12.5" fill="#8b949e">platform tryout LuLuSin bersama tim,</text><text x="516" y="182" font-size="12.5" fill="#8b949e">dan aplikasi pemesanan ikan dengan</text><text x="516" y="199" font-size="12.5" fill="#8b949e">Midtrans.</text>
</g>
<g class="rise" style="animation-delay:1.15s"><text x="760" y="76" font-size="28" font-weight="700" fill="#e6edf3" class="serif">2026</text></g>
<circle cx="766" cy="96" r="5" fill="#0d1117" stroke="#6ca0dc" stroke-width="2" class="pop" style="animation-delay:1.15s"/>
<g class="rise" style="animation-delay:1.25s">
  <text x="760" y="128" font-size="14" font-weight="700" fill="#e6edf3">Lulus &amp; rilis produk</text>
  <text x="760" y="148" font-size="12.5" fill="#8b949e">D3 Teknik Informatika PENS PSDKU</text><text x="760" y="165" font-size="12.5" fill="#8b949e">Sumenep, IPK 3.46. Juara 2 Final</text><text x="760" y="182" font-size="12.5" fill="#8b949e">Project Competition. Merilis Venus</text><text x="760" y="199" font-size="12.5" fill="#8b949e">Digital.</text>
</g>
<style>@keyframes walk { 0.0%, 8.5% { transform: translateX(0.0px); opacity: 1; } 25.0%, 33.5% { transform: translateX(244.0px); opacity: 1; } 50.0%, 58.5% { transform: translateX(488.0px); opacity: 1; } 75.0%, 83.5% { transform: translateX(732.0px); opacity: 1; } 100% { transform: translateX(732.0px); opacity: 0; } }
  .walker { animation: walk 11s 2.2s cubic-bezier(.65,0,.35,1) infinite backwards; }</style>
<circle cx="34" cy="96" r="2.6" fill="#6ca0dc" class="walker"/>
</svg>