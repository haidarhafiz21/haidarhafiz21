<svg xmlns="http://www.w3.org/2000/svg" width="495" height="176" viewBox="0 0 495 176" role="img" aria-label="Cek Unfollow — Periksa siapa yang tidak follow balik di Instagram langsung dari browser, tanpa password. Bisa di komputer, Android, dan iPhone.">
<title>Cek Unfollow — Periksa siapa yang tidak follow balik di Instagram langsung dari browser, tanpa password. Bisa di komputer, Android, dan iPhone.</title>
<style>
  text { font-family: 'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif; }
  .mono { font-family: Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace; letter-spacing: 2px; }
  .serif { font-family: Georgia, 'Times New Roman', serif; font-style: italic; }
  /* Isi selalu tampil walau animasi tidak jalan; animasi hanya efek masuk/hidup */
  .rise { animation: rise .9s 1100ms cubic-bezier(.16,1,.3,1) backwards; }
  .fade { animation: fade 1s 1100ms ease-out backwards; }
  .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: barUp 1.1s 1100ms cubic-bezier(.16,1,.3,1) backwards; }
  .seg { transform-box: fill-box; transform-origin: 0 50%; animation: segIn .9s 1100ms cubic-bezier(.16,1,.3,1) backwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes barUp { from { transform: scaleY(0); } }
  @keyframes segIn { from { transform: scaleX(0); opacity: 0; } }
  @keyframes draw { from { stroke-dashoffset: 1; } }
  
  .pop { transform-box: fill-box; transform-origin: center; animation: pop .6s 1100ms cubic-bezier(.16,1,.3,1) backwards; }
  @keyframes pop { from { opacity: 0; transform: scale(.6); } }
  /* gerak pelan tanpa efek cahaya */
  .live { animation: soft 5s 2600ms ease-in-out infinite; }
  .nudge { animation: nudge 6s 3100ms cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes soft { 0%, 70%, 100% { opacity: 1; } 85% { opacity: .35; } }
  @keyframes nudge { 0%, 84%, 100% { transform: translate(0, 0); } 92% { transform: translate(2.5px, -2.5px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="0.5" y="0.5" width="494" height="175" rx="14" fill="#0d1117" stroke="#2a313c"/>

<g class="rise" style="animation-delay:1150ms">
  <circle cx="31" cy="34" r="3.5" fill="#3fb950" class="live"/>
  <text x="40" y="38" font-size="10.5" fill="#3fb950" class="mono">LIVE</text>
  <text x="467" y="38" font-size="11" fill="#6e7681" text-anchor="end" class="mono" style="letter-spacing:1px">2026</text>
</g>
<g class="rise" style="animation-delay:1220ms"><text x="28" y="70" font-size="19" font-weight="700" fill="#e6edf3" letter-spacing="-.3">Cek Unfollow</text></g>
<g class="rise" style="animation-delay:1300ms"><text x="28" y="95" font-size="12.5" fill="#8b949e">Periksa siapa yang tidak follow balik di Instagram langsung dari browser,</text><text x="28" y="113" font-size="12.5" fill="#8b949e">tanpa password. Bisa di komputer, Android, dan iPhone.</text></g>
<line x1="28" y1="136" x2="467" y2="136" stroke="#2a313c"/>
<g class="rise" style="animation-delay:1380ms">
  <text x="28" y="158" font-size="12" fill="#8b949e">HTML  ·  CSS  ·  JavaScript</text>
  <text x="449" y="158" font-size="12" font-weight="600" fill="#6ca0dc" text-anchor="end">Kunjungi website</text>
  <g transform="translate(455 148)"><path class="nudge" d="M2 10 L10 2 M4 2 H10 V8" fill="none" stroke="#6ca0dc" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>
</svg>