<svg xmlns="http://www.w3.org/2000/svg" width="495" height="286" viewBox="0 0 495 286" role="img" aria-label="Venus Digital — Toko online template Excel &amp; produk digital: katalog, halaman produk, artikel panduan, SEO, dan pemesanan via WhatsApp.">
<title>Venus Digital — Toko online template Excel &amp; produk digital: katalog, halaman produk, artikel panduan, SEO, dan pemesanan via WhatsApp.</title>
<style>
  text { font-family: 'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif; }
  .mono { font-family: Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace; letter-spacing: 2px; }
  .serif { font-family: Georgia, 'Times New Roman', serif; font-style: italic; }
  /* Isi selalu tampil walau animasi tidak jalan; animasi hanya efek masuk/hidup */
  .rise { animation: rise .9s cubic-bezier(.16,1,.3,1) backwards; }
  .fade { animation: fade 1s ease-out backwards; }
  .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: barUp 1.1s cubic-bezier(.16,1,.3,1) backwards; }
  .seg { transform-box: fill-box; transform-origin: 0 50%; animation: segIn .9s cubic-bezier(.16,1,.3,1) backwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes barUp { from { transform: scaleY(0); } }
  @keyframes segIn { from { transform: scaleX(0); opacity: 0; } }
  @keyframes draw { from { stroke-dashoffset: 1; } }
  
  .pop { transform-box: fill-box; transform-origin: center; animation: pop .7s cubic-bezier(.34,1.56,.64,1) backwards; }
  .grow { transform-box: fill-box; transform-origin: 50% 100%; animation: growY .8s cubic-bezier(.16,1,.3,1) backwards; }
  .grow-x { transform-box: fill-box; transform-origin: 0 50%; animation: growX .9s cubic-bezier(.16,1,.3,1) backwards; }
  .draw { animation: draw 1.8s .6s cubic-bezier(.65,0,.35,1) backwards; }
  .cursor { animation: cursor 6s 1s cubic-bezier(.65,0,.35,1) infinite backwards; }
  .ripple { transform-box: fill-box; transform-origin: center; opacity: 0; animation: ripple 6s 1s ease-out infinite; }
  .scan { animation: scan 2.4s ease-in-out infinite alternate; }
  .flow { animation: flow 1.2s linear infinite; }
  .ping { transform-box: fill-box; transform-origin: center; animation: ping 2.2s ease-out infinite; }
  @keyframes pop { from { opacity: 0; transform: scale(.6); } }
  @keyframes growY { from { transform: scaleY(0); } }
  @keyframes growX { from { transform: scaleX(0); } }
  @keyframes cursor {
    0%, 100% { transform: translate(218px, 30px); }
    38%, 52% { transform: translate(0, 0); }
  }
  @keyframes ripple { 0%, 40% { opacity: 0; transform: scale(.6); } 44% { opacity: .9; } 60%, 100% { opacity: 0; transform: scale(2.4); } }
  @keyframes scan { from { transform: translateY(0); } to { transform: translateY(46px); } }
  @keyframes flow { to { stroke-dashoffset: -18; } }
  @keyframes ping { from { opacity: .9; transform: scale(1); } to { opacity: 0; transform: scale(3.4); } }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
