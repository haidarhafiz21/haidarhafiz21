<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="A. Haidar Hafiz — Web &amp; Mobile Developer">
<title>A. Haidar Hafiz — Web &amp; Mobile Developer</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#071a1c"/>
    <stop offset=".55" stop-color="#0b3b3a"/>
    <stop offset="1" stop-color="#115e59"/>
  </linearGradient>
  <radialGradient id="glow" cx=".82" cy=".2" r=".6">
    <stop offset="0" stop-color="#2dd4bf" stop-opacity=".35"/>
    <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
  </radialGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.3" fill="#99f6e4" fill-opacity=".14"/>
  </pattern>
  <clipPath id="card"><rect width="1200" height="300" rx="18"/></clipPath>
</defs>
<style>
  text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
  .in { animation: rise .9s cubic-bezier(.2,.8,.2,1) backwards; }
  .float { animation: float 7s ease-in-out infinite alternate; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  @keyframes float { to { transform: translate(-18px, 12px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g clip-path="url(#card)">
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <g class="float" opacity=".9">
    <circle cx="1030" cy="70" r="120" fill="none" stroke="#2dd4bf" stroke-opacity=".18" stroke-width="2"/>
    <circle cx="1030" cy="70" r="70" fill="none" stroke="#2dd4bf" stroke-opacity=".25" stroke-width="2"/>
  </g>
  <!-- jendela kode dekoratif -->
  <g transform="translate(840 120)" class="in" style="animation-delay:.45s">
    <rect width="300" height="140" rx="12" fill="#0d1117" fill-opacity=".72" stroke="#2dd4bf" stroke-opacity=".3"/>
    <circle cx="20" cy="20" r="5" fill="#f87171"/><circle cx="38" cy="20" r="5" fill="#fbbf24"/><circle cx="56" cy="20" r="5" fill="#34d399"/>
    <text x="20" y="56" font-size="14" fill="#c4b5fd" font-family="Consolas, 'Courier New', monospace">const <tspan fill="#e6edf3">dev</tspan> <tspan fill="#8b949e">=</tspan> <tspan fill="#8b949e">{</tspan></text>
    <text x="38" y="80" font-size="14" fill="#7dd3fc" font-family="Consolas, 'Courier New', monospace">mobile<tspan fill="#8b949e">:</tspan> <tspan fill="#86efac">"Flutter"</tspan><tspan fill="#8b949e">,</tspan></text>
    <text x="38" y="102" font-size="14" fill="#7dd3fc" font-family="Consolas, 'Courier New', monospace">backend<tspan fill="#8b949e">:</tspan> <tspan fill="#86efac">"Express.js"</tspan><tspan fill="#8b949e">,</tspan></text>
    <text x="20" y="124" font-size="14" fill="#8b949e" font-family="Consolas, 'Courier New', monospace">};</text>
  </g>
  <g class="in" style="animation-delay:.05s">
    <text x="64" y="92" font-size="16" font-weight="600" fill="#5eead4" letter-spacing="3">HALO, SAYA</text>
  </g>
  <g class="in" style="animation-delay:.15s">
    <text x="62" y="150" font-size="54" font-weight="800" fill="#ffffff" letter-spacing="-1">A. Haidar Hafiz</text>
  </g>
  <g class="in" style="animation-delay:.25s">
    <text x="64" y="192" font-size="22" font-weight="500" fill="#ccfbf1">Web &amp; Mobile Developer · Flutter · Node.js</text>
  </g>
  <g class="in" style="animation-delay:.35s" font-size="14" font-weight="600">
    <rect x="64" y="218" width="214" height="34" rx="17" fill="#ffffff" fill-opacity=".08" stroke="#5eead4" stroke-opacity=".35"/>
    <circle cx="86" cy="235" r="5" fill="#34d399"/>
    <text x="100" y="240" fill="#e6fffa">Terbuka untuk proyek</text>
    <rect x="290" y="218" width="226" height="34" rx="17" fill="#ffffff" fill-opacity=".08" stroke="#5eead4" stroke-opacity=".35"/>
    <path transform="translate(306 226)" fill="#5eead4" d="M8 0a6 6 0 0 0-6 6c0 4.5 6 12 6 12s6-7.5 6-12a6 6 0 0 0-6-6zm0 8.4A2.4 2.4 0 1 1 8 3.6a2.4 2.4 0 0 1 0 4.8z"/>
    <text x="328" y="240" fill="#e6fffa">Pamekasan, Jawa Timur</text>
  </g>
